<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">YuzinA Studio / 歌ってみたMIX</title>
  <desc id="desc">A calm, typography-only YuzinA Studio card. 歌声の良さを残して、聴きやすいMIXへ。</desc>
  <rect width="1200" height="630" fill="#f4f7f6"/>
  <text x="80" y="102" fill="#0d6266" font-family="Noto Sans,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="4">VOCAL MIX</text>
  <text x="76" y="228" fill="#101820" font-family="Noto Sans,Arial,sans-serif" font-size="80" font-weight="700" letter-spacing="-2">YuzinA Studio</text>
  <g fill="#18232e" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif" font-size="42" font-weight="400">
    <text x="80" y="337">歌声の良さを残して、</text>
    <text x="80" y="403">聴きやすいMIXへ。</text>
  </g>
  <path d="M80 507H1120" stroke="#d3dfdf"/>
  <text x="80" y="558" fill="#60707f" font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif" font-size="22">歌ってみたMIX</text>
  <text x="1120" y="558" fill="#60707f" font-family="Noto Sans,Arial,sans-serif" font-size="20" text-anchor="end">YuzinA Studio</text>
</svg>
